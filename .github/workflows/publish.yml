name: Publish to GitHub Packages

# Publishes this fork's build of cyclonedx-maven-plugin to the repository's
# GitHub Packages Maven registry, so downstream builds can consume the fix from
# https://github.com/CycloneDX/cyclonedx-maven-plugin/pull/706 before it is merged upstream.
#
# Versions published here are NOT snapshots, on purpose: resolving a -SNAPSHOT makes Maven
# check maven-metadata.xml on every build, which is the very behaviour the patch removes and
# would muddy any before/after measurement downstream. Each run publishes an immutable
# 2.10.0-dm.<run_number> that resolves once and stays cached.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (default: 2.10.0-dm.<run_number>)'
        required: false
        type: string
      skip_its:
        description: 'Skip the invoker integration tests (faster, less safe)'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 8 to match the project's own CI: the pom sets maven.compiler.release=8
      # and the published artifact must stay consumable by Java 8 builds.
      - name: Set up JDK 8
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Resolve version
        id: v
        run: echo "version=${{ inputs.version || format('2.10.0-dm.{0}', github.run_number) }}" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: >
          mvn -B --no-transfer-progress
          org.codehaus.mojo:versions-maven-plugin:2.16.2:set
          -DnewVersion=${{ steps.v.outputs.version }}
          -DgenerateBackupPoms=false

      # A single `deploy` runs the whole lifecycle: unit tests, the invoker integration
      # tests, and only then the upload. Nothing reaches the registry unless it all passes.
      - name: Build, test and publish
        run: >
          mvn -B --no-transfer-progress deploy
          -Dgpg.skip=true
          ${{ inputs.skip_its && '-Dinvoker.skip=true' || '' }}
          -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: success()
        run: |
          V='${{ steps.v.outputs.version }}'
          {
            echo "## Published \`com.github.devopsmindset:cyclonedx-maven-plugin:$V\`"
            echo
            echo "From \`${{ github.sha }}\` on \`${{ github.ref_name }}\`."
            echo
            echo '### Consume it'
            echo
            echo 'GitHub Packages requires authentication even for public packages, so the'
            echo 'consuming build needs a token with `read:packages` in its `settings.xml`:'
            echo
            echo '```xml'
            echo '<pluginRepositories>'
            echo '  <pluginRepository>'
            echo '    <id>github-devopsmindset</id>'
            echo "    <url>https://maven.pkg.github.com/${{ github.repository }}</url>"
            echo '    <releases><enabled>true</enabled></releases>'
            echo '    <snapshots><enabled>false</enabled></snapshots>'
            echo '  </pluginRepository>'
            echo '</pluginRepositories>'
            echo '```'
            echo
            echo 'Then pin the plugin version:'
            echo
            echo '```xml'
            echo '<plugin>'
            echo '  <groupId>com.github.devopsmindset</groupId>'
            echo '  <artifactId>cyclonedx-maven-plugin</artifactId>'
            echo "  <version>$V</version>"
            echo '</plugin>'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
